Port 2222
ListenAddress 127.0.0.1
PidFile /run/aula-ssh/sshd.pid
HostKey /run/aula-ssh/host
AuthorizedKeysFile /run/aula-ssh/cliente.pub
StrictModes yes
AllowUsers hpc
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
DisableForwarding yes
PermitTunnel no
PermitUserRC no
